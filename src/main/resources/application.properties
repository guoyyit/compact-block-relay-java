# 紧凑区块传播（compact block relay）配置
# 短标识长度（字节）。固定使用 64 位 SipHash-2-4，取 8：百万级交易池内碰撞概率约 1e-8/区块。
compact-relay.short-id-bytes=8
# 紧凑重建整体超时（毫秒），超时后回退完整区块传输。
compact-relay.rebuild-timeout-ms=2000
# 单次缺失交易补齐请求超时（毫秒），多个缺失下标合并为一次请求。
compact-relay.tx-request-timeout-ms=500
# 本地交易池容量上界，超出后按 FIFO 淘汰最早交易。
compact-relay.max-mempool=10000
# 已见区块哈希去重窗口上界（LRU），用于丢弃重复/迟到通知。
compact-relay.max-seen-hashes=4096
# 孤儿区块/孤儿通知缓存上界，超出后丢弃最旧条目。
compact-relay.max-orphans=64
# 缺失交易补齐请求失败后的重试次数，耗尽后回退完整区块传输。
compact-relay.max-request-retries=1
# 单次完整区块回退请求超时（毫秒），超时后按 max-fallback-retries 有限重试。
compact-relay.block-request-timeout-ms=1000
# 完整区块回退请求超时后的重试次数；耗尽后释放进行中占位，允许后续同区块通知重新进入流程。
compact-relay.max-fallback-retries=2
